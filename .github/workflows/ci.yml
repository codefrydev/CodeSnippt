name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate snippets.json from data/
        run: python tools/merge_snippets.py

      - name: Ensure snippets.json matches committed output (run merge locally before push)
        run: git diff --exit-code snippets.json

      - name: Smoke check (required files)
        run: bash tools/verify-highlight.sh
