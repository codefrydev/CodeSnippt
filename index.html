<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Snippets Cheat Sheet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/codemirror.min.css" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/theme/dracula.min.css" crossorigin="anonymous" />
    <link rel="stylesheet" href="styles.css" />
    <script type="text/javascript">
    (function () {
        var loaded = false;
        var events = ["scroll", "click", "touchstart", "keydown"];
        var opts = { passive: true, capture: true };
        function loadClarity() {
            if (loaded) return;
            loaded = true;
            events.forEach(function (event) {
                window.removeEventListener(event, loadClarity, opts);
            });
            (function (c, l, a, r, i, t, y) {
                c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments); };
                t = l.createElement(r); t.async = 1; t.src = "https://www.clarity.ms/tag/" + i;
                y = l.getElementsByTagName(r)[0]; y.parentNode.insertBefore(t, y);
            })(window, document, "clarity", "script", "mxr4hxioh4");
        }
        events.forEach(function (event) {
            window.addEventListener(event, loadClarity, opts);
        });
    })();
    </script>
</head>
<body class="flex h-screen flex-col bg-gray-950 text-gray-100 font-sans selection:bg-blue-500/30 overflow-hidden lg:flex-row">

    <div
        id="nav-backdrop"
        class="fixed inset-0 z-30 bg-black/60 backdrop-blur-[2px] lg:hidden"
        aria-hidden="true"
    ></div>

    <aside
        id="category-sidebar"
        class="fixed inset-y-0 left-0 z-40 flex w-[min(20rem,88vw)] max-w-[20rem] flex-col shrink-0 border-r border-gray-800 bg-gray-900 lg:static lg:z-auto lg:w-64 lg:max-w-none"
        aria-label="Categories"
    >
        <div class="flex items-center justify-between gap-2 border-b border-gray-800 p-4 pt-[max(1rem,env(safe-area-inset-top))] lg:border-b-0 lg:p-6">
            <h1 class="text-lg font-bold bg-blue-100 bg-clip-text text-transparent sm:text-xl">
                Snippets
            </h1>
            <button
                type="button"
                id="nav-close-btn"
                class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg text-gray-400 transition-colors hover:bg-gray-800 hover:text-white focus:outline-none focus:ring-2 focus:ring-blue-500/50 lg:hidden"
                aria-label="Close menu"
            >
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <nav id="category-nav" class="flex-1 space-y-1 overflow-y-auto overscroll-contain px-3 py-2 pb-[max(0.5rem,env(safe-area-inset-bottom))] lg:px-4">
            <p class="mb-3 px-2 text-xs font-semibold uppercase tracking-wider text-gray-500">Categories</p>
        </nav>
    </aside>

    <main class="flex min-h-0 min-w-0 flex-1 flex-col overflow-hidden">
        <header class="shrink-0 border-b border-gray-800 bg-gray-900/50 px-4 py-4 backdrop-blur-md sm:px-6 lg:sticky lg:top-0 lg:z-10 lg:px-8 lg:py-6">
            <div class="mb-4 flex items-center gap-3 border-b border-gray-800 pb-4 lg:hidden">
                <button
                    type="button"
                    id="nav-menu-btn"
                    class="flex h-11 w-11 shrink-0 items-center justify-center rounded-lg border border-gray-700 bg-gray-900 text-gray-300 transition-colors hover:border-gray-600 hover:bg-gray-800 hover:text-white focus:outline-none focus:ring-2 focus:ring-blue-500/50"
                    aria-label="Open categories"
                    aria-expanded="false"
                    aria-controls="category-sidebar"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="18" x2="20" y2="18"></line></svg>
                </button>
                <div class="min-w-0 flex-1">
                    <p class="truncate text-xs font-medium uppercase tracking-wide text-gray-500">Category</p>
                    <p id="mobile-category-label" class="truncate text-base font-semibold text-white">All</p>
                </div>
            </div>
            <div class="flex flex-col gap-4 xl:flex-row xl:items-start xl:justify-between">
                <div class="min-w-0">
                    <h2 id="active-category-title" class="text-xl font-bold text-white sm:text-2xl">All Snippets</h2>
                    <p class="mt-1 hidden text-sm text-gray-400 sm:block">Quick copy-paste commands for daily development.</p>
                </div>
                <div class="flex w-full flex-col gap-3 sm:flex-row xl:w-auto xl:min-w-[22rem]">
                    <label class="flex flex-col gap-1 shrink-0">
                        <span class="text-xs font-medium text-gray-500 uppercase tracking-wide">Layout</span>
                        <select
                            id="layout-select"
                            class="w-full min-h-[44px] sm:min-h-0 sm:w-44 bg-gray-900 border border-gray-700 text-white rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500"
                            aria-label="Snippet layout"
                        >
                            <option value="responsive">Responsive grid</option>
                            <option value="1col">Single column</option>
                            <option value="2col">Two columns</option>
                            <option value="3col">Three columns</option>
                            <option value="list">List view</option>
                            <option value="masonry">Masonry</option>
                        </select>
                    </label>
                    <label class="flex flex-col gap-1 flex-1 min-w-0">
                        <span class="text-xs font-medium text-gray-500 uppercase tracking-wide">Search</span>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none" id="search-icon-container"></div>
                            <input
                                type="text"
                                id="search-input"
                                placeholder="Commands, titles, descriptions…"
                                class="w-full min-h-[44px] sm:min-h-0 bg-gray-900 border border-gray-700 text-white rounded-lg pl-10 pr-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all placeholder-gray-600 text-sm"
                            />
                        </div>
                    </label>
                </div>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto bg-[#0a0f18] p-4 pb-[max(1rem,env(safe-area-inset-bottom))] sm:p-6 lg:p-8">
            <div id="app-status" class="flex flex-col items-center justify-center min-h-[400px] text-gray-400">
                <p id="app-status-message" class="text-lg">Loading snippets…</p>
            </div>
            <div id="snippets-container" class="hidden gap-6 transition-all duration-200"></div>
            <div id="empty-state" class="hidden flex flex-col items-center justify-center h-full text-gray-500 min-h-[400px]">
                <div id="empty-icon-container" class="mb-4 opacity-20"></div>
                <p id="empty-message" class="text-lg">No snippets found.</p>
                <button id="clear-search-btn" type="button" class="mt-4 min-h-[44px] rounded-lg px-4 py-2 text-sm text-blue-400 hover:bg-blue-500/10 hover:underline focus:outline-none focus:ring-2 focus:ring-blue-500/50">Clear search</button>
            </div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/codemirror.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/mode/clike/clike.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/mode/sql/sql.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/mode/shell/shell.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/mode/javascript/javascript.min.js" crossorigin="anonymous"></script>
    <script src="app.js"></script>
</body>
</html>
